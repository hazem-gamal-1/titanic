[project]
name = "titanic-app"
version = "0.1.0"
description = "Titanic data visualization app"
requires-python = ">=3.13,<=3.14"
dependencies = [
    "plotly>=7.1.0",
    "streamlit>=1.67.0",
]



[project.scripts]
titanic-app = "titanic_app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"


[tool.uv]
package=false